<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 278 280" width="278" height="280">
  <defs>
    <linearGradient id="robotGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4AA8D8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hatGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991B1B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Robot/Copilot Head - main body -->
  <ellipse cx="139" cy="160" rx="120" ry="100" fill="url(#robotGradient)" stroke="#2563EB" stroke-width="3"/>
  
  <!-- Left eye socket -->
  <ellipse cx="90" cy="145" rx="35" ry="45" fill="#1a1a2e"/>
  
  <!-- Right eye socket -->
  <ellipse cx="188" cy="145" rx="35" ry="45" fill="#1a1a2e"/>
  
  <!-- Mouth/visor area -->
  <rect x="105" y="195" width="68" height="35" rx="8" fill="#1a1a2e"/>
  
  <!-- Left mouth line -->
  <rect x="118" y="200" width="8" height="25" rx="4" fill="url(#robotGradient)"/>
  
  <!-- Right mouth line -->
  <rect x="152" y="200" width="8" height="25" rx="4" fill="url(#robotGradient)"/>
  
  <!-- Santa Hat -->
  <!-- Hat base/brim - white fluffy part -->
  <ellipse cx="139" cy="75" rx="100" ry="20" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="2"/>
  
  <!-- Hat main red part -->
  <path d="M 50 75 Q 60 20 139 5 Q 218 20 228 75 Z" fill="url(#hatGradient)" stroke="#991B1B" stroke-width="2"/>
  
  <!-- Hat tip curving to the right -->
  <path d="M 139 5 Q 200 -10 230 30 Q 240 45 235 55" fill="url(#hatGradient)" stroke="#991B1B" stroke-width="2"/>
  
  <!-- White pom-pom at tip -->
  <circle cx="235" cy="50" r="18" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="2"/>
  
  <!-- Snow/sparkle effects -->
  <circle cx="60" cy="120" r="3" fill="white" opacity="0.8"/>
  <circle cx="220" cy="130" r="2" fill="white" opacity="0.7"/>
  <circle cx="180" cy="100" r="2.5" fill="white" opacity="0.6"/>
  
  <!-- Holly decoration on hat -->
  <circle cx="80" cy="70" r="6" fill="#22C55E"/>
  <circle cx="95" cy="65" r="6" fill="#22C55E"/>
  <circle cx="87" cy="58" r="4" fill="#DC2626"/>
</svg>
